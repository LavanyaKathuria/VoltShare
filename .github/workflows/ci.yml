name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firebase Emulator Suite needs a JDK
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install (root + functions via postinstall)
        run: npm ci

      - name: Type-check app
        run: npm run lint

      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - name: Unit tests
        run: npm run test:unit

      - name: Security rules tests (Firestore + Storage emulators)
        run: npm run test:rules

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_USE_EMULATORS: "false"
